services:
  # RippleGuard FastAPI Engine
  - type: web
    name: rippleguard-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"

  # RippleGuard Frontend (Static Site)
  - type: web
    name: rippleguard-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: rippleguard-backend
          property: host
